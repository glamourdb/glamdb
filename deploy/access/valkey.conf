# Dedicated ephemeral OAuth2 Proxy sessions; never attach a persistent volume.
bind 0.0.0.0
port 6379
protected-mode yes
aclfile /run/secrets/glamdb/session-store.acl
databases 1
maxclients 128
maxmemory 64mb
maxmemory-policy noeviction
timeout 0
tcp-keepalive 60
save ""
appendonly no
dir /data
loglevel warning
logfile ""
hide-user-data-from-log yes
crash-log-enabled no
crash-memcheck-enabled no
slowlog-log-slower-than -1
acllog-max-len 0
latency-monitor-threshold 0
# The ACL grants only connection, session and lock operations. No dump, monitor,
# configuration, persistence, module, replication or administrative commands.
