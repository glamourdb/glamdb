provider = "keycloak-oidc"
http_address = "0.0.0.0:4180"
upstreams = ["http://gateway:8080/"]
# Compose supplies the public HTTPS issuer and callback through native env options.
client_id = "glamdb-workbench"
client_secret_file = "/run/secrets/glamdb/workbench.secret"
cookie_secret_file = "/run/secrets/glamdb/cookie.secret"
cookie_name = "__Host-glamdb-session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
# Native shared sessions serialize refreshes and reload the latest token state.
session_store_type = "redis"
redis_connection_url = "redis://session-store:6379/0"
redis_username = "oauth2-proxy"
# OAUTH2_PROXY_REDIS_PASSWORD comes from the private owned env_file.
cookie_refresh = "30s"
cookie_expire = "8h"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
scope = "openid profile email organization:*"
email_domains = ["*"]
reverse_proxy = true
trusted_proxy_ips = ["172.30.80.2/32"]
pass_access_token = true
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
skip_auth_strip_headers = true
skip_jwt_bearer_tokens = true
bearer_token_login_fallback = false
oidc_extra_audiences = ["glamdb-api", "glamdb-gateway"]
api_routes = ["^/databases(/|$)", "^/workbench(/|$)"]
force_json_errors = false
skip_provider_button = true
request_logging = false
auth_logging = false
standard_logging = false
