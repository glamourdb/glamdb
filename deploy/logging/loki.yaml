auth_enabled: false

server:
  http_listen_address: ${LOKI_LISTEN_ADDRESS}
  http_listen_port: ${LOKI_HTTP_PORT}
  grpc_listen_address: ${LOKI_LISTEN_ADDRESS}
  grpc_listen_port: ${LOKI_GRPC_PORT}
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA_DIR}
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR}/chunks
      rules_directory: ${LOKI_DATA_DIR}/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    disk_full_threshold: 0.9
    replay_memory_ceiling: 256MB
    dir: ${LOKI_DATA_DIR}/wal
  chunk_idle_period: 5m
  max_chunk_age: 1h
  chunk_target_size: 1048576

compactor:
  working_directory: ${LOKI_DATA_DIR}/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  compaction_interval: 10m

limits_config:
  retention_period: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 256KB
  per_stream_rate_limit_burst: 512KB
  max_line_size: 4096
  max_line_size_truncate: false
  max_global_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  max_query_length: 24h
  max_query_parallelism: 4
  max_entries_limit_per_query: 1000
  query_timeout: 30s
  max_concurrent_tail_requests: 5

querier:
  max_concurrent: 2

analytics:
  reporting_enabled: false
