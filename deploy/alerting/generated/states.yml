        {
          "alert": "GlamDBCheckState",
          "expr": "glamdb_alert_state{check=\"gateway_availability\",cluster=\"local\",service=\"glamdb\"} == 3",
          "for": "2m",
          "labels": {
            "cluster": "local",
            "service": "glamdb",
            "check": "gateway_availability",
            "state": "NODATA",
            "notify_nodata": "true"
          },
          "annotations": {
            "summary": "Gateway scrape availability",
