{
  "groups": [
    {
      "name": "glamdb-four-state",
      "interval": "15s",
      "rules": [
        {
          "record": "glamdb_alert_value",
          "expr": "((max(1-min(up{job=\"glamdb-gateway\",cluster=\"local\",service=\"glamdb\"})) > -Inf) and (max(1-min(up{job=\"glamdb-gateway\",cluster=\"local\",service=\"glamdb\"})) < +Inf)) and on() ((time() - min(timestamp(up{job=\"glamdb-gateway\",cluster=\"local\",service=\"glamdb\"})) >= -5) and (time() - min(timestamp(up{job=\"glamdb-gateway\",cluster=\"local\",service=\"glamdb\"})) < 90))",
          "labels": {
            "cluster": "local",
            "service": "glamdb",
            "check": "gateway_availability"
          }
        },
        {
          "record": "glamdb_alert_state",
          "expr": "((glamdb_alert_value{check=\"gateway_availability\",cluster=\"local\",service=\"glamdb\"} >= bool 0.5) + (glamdb_alert_value{check=\"gateway_availability\",cluster=\"local\",service=\"glamdb\"} >= bool 1)) or on() vector(3)",
          "labels": {
            "cluster": "local",
            "service": "glamdb",
            "check": "gateway_availability"
          }
        },
        {
          "alert": "GlamDBCheckState",
          "expr": "glamdb_alert_state{check=\"gateway_availability\",cluster=\"local\",service=\"glamdb\"} == 0",
          "for": "2m",
          "labels": {
            "cluster": "local",
            "service": "glamdb",
            "check": "gateway_availability",
            "state": "OK",
            "notify_nodata": "true"
          },
          "annotations": {
            "summary": "Gateway scrape availability",
            "description": "ALARM means a configured gateway target fails scraping; NODATA means target data is missing. This is not an end-to-end readiness probe.",
            "runbook_url": "https://github.com/glamourdb/glamdb/blob/main/ALERTING.md",
            "observed_at": "{{ with query \"time()\" }}{{ . | first | value }}{{ end }}"
          }
        },
        {
          "alert": "GlamDBCheckState",
          "expr": "glamdb_alert_state{check=\"gateway_availability\",cluster=\"local\",service=\"glamdb\"} == 1",
          "for": "2m",
          "labels": {
            "cluster": "local",
            "service": "glamdb",
            "check": "gateway_availability",
            "state": "WARN",
            "notify_nodata": "true"
          },
          "annotations": {
            "summary": "Gateway scrape availability",
            "description": "ALARM means a configured gateway target fails scraping; NODATA means target data is missing. This is not an end-to-end readiness probe.",
            "runbook_url": "https://github.com/glamourdb/glamdb/blob/main/ALERTING.md",
            "observed_at": "{{ with query \"time()\" }}{{ . | first | value }}{{ end }}"
          }
