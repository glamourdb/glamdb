{
  "rule_files": [
    "../generated/states.yml"
  ],
  "evaluation_interval": "15s",
  "tests": [
    {
      "name": "healthy -> down -> missing must never resolve as OK",
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"glamdb-gateway\",cluster=\"local\",service=\"glamdb\"}",
          "values": "1+0x11 0+0x7 stale _x20"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "max(glamdb_alert_state{check=\"gateway_availability\"})",
          "eval_time": "2m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "count(ALERTS{check=\"gateway_availability\",state=\"OK\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "2m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "max(glamdb_alert_state{check=\"gateway_availability\"})",
          "eval_time": "4m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 2
            }
          ]
        },
        {
          "expr": "count(ALERTS{check=\"gateway_availability\",state=\"ALARM\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "4m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "max(glamdb_alert_state{check=\"gateway_availability\"})",
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 3
            }
          ]
        },
        {
          "expr": "count(ALERTS{check=\"gateway_availability\",state=\"OK\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "count(ALERTS{check=\"gateway_availability\",state=\"NODATA\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "7m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        },
        {
          "expr": "count(glamdb_alert_state)",
          "eval_time": "7m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 30
            }
          ]
        }
      ]
    },
