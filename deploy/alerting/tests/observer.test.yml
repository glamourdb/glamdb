        {
          "series": "prometheus_rule_group_last_evaluation_timestamp_seconds{job=\"glamdb-pipeline\",component=\"prometheus\",rule_group=\"states\"}",
          "values": "0+0x30"
        },
        {
          "series": "prometheus_rule_evaluation_failures_total{job=\"glamdb-pipeline\",component=\"prometheus\"}",
          "values": "0+0x30"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "count(ALERTS{alertname=\"GlamDBPipelineSourceUnavailable\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "3m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 0
            }
          ]
        },
        {
          "expr": "count(ALERTS{alertname=\"GlamDBPipelineEvaluationStalled\",alertstate=\"firing\"}) or vector(0)",
          "eval_time": "3m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "scrape failure detected without main evaluator",
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"glamdb-pipeline\",component=\"prometheus\"}",
          "values": "0+0x30"
        },
        {
          "series": "up{job=\"glamdb-pipeline\",component=\"alertmanager\"}",
