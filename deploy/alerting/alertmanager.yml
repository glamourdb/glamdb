global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [cluster, service, check, namespace, pod, node]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['state="NODATA"', 'notify_nodata="false"']
      receiver: visible-only
    - matchers: ['state="OK"']
      repeat_interval: 24h

receivers:
  - name: visible-only
  - name: telegram
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: false
        parse_mode: ""
        timeout: 5s
        message: |-
          {{ range .Alerts.Firing }}{{ .Labels.state }} GlamDB {{ .Labels.check }}
          Scope: {{ .Labels.cluster }}/{{ .Labels.service }} {{ .Labels.namespace }} {{ .Labels.pod }} {{ .Labels.node }}
          Observed at (Unix seconds): {{ .Annotations.observed_at }}
          State since (UTC): {{ .StartsAt.UTC.Format "2006-01-02T15:04:05Z" }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ .Annotations.runbook_url }}
          {{ end }}
        http_config:
          follow_redirects: false

# State rules are exclusive. These guards also suppress stale lower states
# during a rolling rule/configuration change; never inhibit NODATA by ALARM.
inhibit_rules:
  - source_matchers: ['state="ALARM"']
    target_matchers: ['state=~"OK|WARN"']
    equal: [cluster, service, check, namespace, pod, node]
  - source_matchers: ['state="NODATA"']
    target_matchers: ['state=~"OK|WARN|ALARM"']
    equal: [cluster, service, check, namespace, pod, node]
