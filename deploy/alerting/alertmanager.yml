global:
  resolve_timeout: 5m

route:
  receiver: telegram-outbox
  group_by: [cluster, service, check, namespace, pod, node]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['state="NODATA"', 'notify_nodata="false"']
      receiver: visible-only
    - matchers: ['state="OK"']
      repeat_interval: 24h

receivers:
  - name: visible-only
  - name: telegram-outbox
    webhook_configs:
      - url: http://alert-transport:9087/alerts
        send_resolved: false
        max_alerts: 100
        timeout: 10s
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_bearer

# State rules are exclusive. These guards also suppress stale lower states
# during a rolling rule/configuration change; never inhibit NODATA by ALARM.
inhibit_rules:
  - source_matchers: ['state="ALARM"']
    target_matchers: ['state=~"OK|WARN"']
    equal: [cluster, service, check, namespace, pod, node]
  - source_matchers: ['state="NODATA"']
    target_matchers: ['state=~"OK|WARN|ALARM"']
    equal: [cluster, service, check, namespace, pod, node]
