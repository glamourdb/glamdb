name: glamdb-alerting

services:
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
      - --web.listen-address=:9093
      - --cluster.listen-address=
      - --web.external-url=http://localhost:9093
      - --alerts.per-alertname-limit=1000
      - --silences.max-silences=1000
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [alert_webhook_bearer]
    networks: [observability]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  alert-transport:
    build:
      context: ../..
      dockerfile: deploy/alerting/Dockerfile
    command: [--capacity, "1000", --prometheus-url, "http://prometheus:9090"]
    ports: ["127.0.0.1:${ALERT_TRANSPORT_PORT:-9087}:9087"]
    volumes: [telegram-outbox:/data]
    secrets: [telegram_bot_token, telegram_chat_id, alert_webhook_bearer]
    networks: [observability]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9087/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

secrets:
  telegram_bot_token:
    file: ${ALERTING_SECRETS_DIR:-../../artifacts/alerting/secrets}/telegram_bot_token
  telegram_chat_id:
    file: ${ALERTING_SECRETS_DIR:-../../artifacts/alerting/secrets}/telegram_chat_id
  alert_webhook_bearer:
    file: ${ALERTING_SECRETS_DIR:-../../artifacts/alerting/secrets}/alert_webhook_bearer

volumes:
  alertmanager-data:
  telegram-outbox:

networks:
  observability:
    name: glamdb-observability
    external: true
