name: Native tests

# Required native checks must be emitted for documentation-only PRs too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: >-
          ${{ fromJSON(github.event_name == 'pull_request'
            && '["normal", "asan", "ubsan", "tsan"]'
            || '["normal", "asan", "ubsan", "msan", "tsan", "lsan"]') }}
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out the proposed change and pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install LLVM 18 and build tools
        run: |
          bash scripts/ci-apt-install.sh \
            clang-18 clang-format-18 clang-tidy-18 llvm-18 \
            libc++-18-dev libc++abi-18-dev libclang-rt-18-dev \
            cmake ninja-build make pkg-config zlib1g-dev libssl-dev

      - name: Set up Python for native SDK, Arrow and schema checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install hash-pinned native client test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps -r requirements-native-ci.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e sdk/python
          .venv/bin/python -c 'import glamdb_sdk, httpx, pyarrow, jsonschema'
          if [[ "$PROFILE" == normal ]]; then
            .venv/bin/python -m pip install --disable-pip-version-check \
              --require-hashes --only-binary=:all: --no-deps -r tools/workload/requirements.txt
            .venv/bin/python -m pip install --no-deps --no-build-isolation -e tools/workload
            .venv/bin/python -m pip install --disable-pip-version-check \
              --require-hashes --only-binary=:all: --no-deps -r tools/acceptance/requirements.txt
          fi

      - name: Set up Node for native browser acceptance
        if: matrix.profile == 'normal'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install pinned browser dependencies
        if: matrix.profile == 'normal'
        run: |
          npm --prefix ui ci
          npm --prefix ui exec -- playwright install --with-deps chromium

      - name: Set address-space layout for LLVM 18 shadow memory
        if: matrix.profile == 'msan' || matrix.profile == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Check out LLVM 18.1.8 runtime sources
        if: matrix.profile == 'msan' || matrix.profile == 'tsan'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llvm/llvm-project
          ref: 3b5b5c1ec4a3095ab096dd780e84d7ab81f3d7ff # llvmorg-18.1.8
          path: .deps/llvm-project
          persist-credentials: false
          sparse-checkout: |
            cmake
            llvm/cmake
            libcxx
            libcxxabi
            runtimes

      - name: Build the instrumented C++ standard library
        if: matrix.profile == 'msan' || matrix.profile == 'tsan'
        run: bash scripts/ci-native.sh "$PROFILE" runtime

      - name: Build pinned dependencies for this profile
        run: bash scripts/ci-native.sh "$PROFILE" deps

      - name: Build all native tests with storage enabled
        run: bash scripts/ci-native.sh "$PROFILE" build

      - name: Run all CTest suites and standalone probes
        run: bash scripts/ci-native.sh "$PROFILE" test

      - name: Verify standalone network CLI and native browser
        if: matrix.profile == 'normal'
        run: bash scripts/check-native-http.sh build/ci-normal build/ci-normal-client/glamdb-cli

      - name: Retain native reports and sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.profile }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/native-${{ matrix.profile }}/*.log
            artifacts/native-${{ matrix.profile }}/*junit.xml
            artifacts/native-${{ matrix.profile }}/system-workspace/report.json
            artifacts/native-${{ matrix.profile }}/system-workspace/browser-*/*.png
            artifacts/native-${{ matrix.profile }}/system-workspace/browser-*/trace.zip
            artifacts/native-${{ matrix.profile }}/system-workspace/browser-*/*.arrow
